<style>
/* ===== Krupamarg design system · peach & cream =====
   Tokens first; every component below reads only from these. */
:root{
  /* surfaces — warm cream, as in the reference */
  --page:#F7F2EA; --bg:#FBF7F0; --bg2:#F4EEE4; --surface:#FFFDF9; --sunk:#F3EEE6; --peach:#E6D7C3; --peach-soft:#F5ECDD;
  /* ink — deep navy */
  --fg:#1F3557; --muted:#5F6F84; --line:#E7E0D4;
  /* brand — navy, dusk blue, temple gold */
  --navy:#23406A; --terracotta:#C9A15A; --accent:#24426B; --onaccent:#FFFFFF; --gold:#C9A15A; --gold-ink:#8C6A2B; --mandala:#C9A15A;
  --sky:#E4EBF2; --sky-ink:#2E4A6E;
  /* status */
  --ok:#3F6B54; --okbg:#E6F0EA; --warn:#8A5E22; --warnbg:#FBEFDD; --err:#A2483F; --errbg:#F9E5E2;
  /* type */
  --display:'Lora', 'Noto Serif Devanagari', Georgia, serif;
  --body:'Manrope', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
  /* shape & depth */
  --r:18px; --r-sm:12px; --r-pill:999px;
  --shadow:0 1px 2px rgba(31,53,87,.04), 0 6px 20px rgba(31,53,87,.06);
  --shadow-lg:0 14px 44px rgba(31,53,87,.14);
  --hero-grad:linear-gradient(115deg,#34557D 0%,#46698F 45%,#6E8FAE 78%,#B8B2A2 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--page);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}

/* ----- shell: fixed app bar + scrolling content + fixed tab bar ----- */
.shell{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px){.shell{inset:auto;top:24px;bottom:24px;left:50%;transform:translateX(-50%);width:440px;border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}}
.appbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb, var(--bg) 92%, transparent);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.01em;color:var(--navy);user-select:none}
.brand i,.mark{border-radius:50%;background:radial-gradient(circle at 35% 30%,#3A5D88,#1F3A60 75%);color:#E9C77E;display:grid;place-items:center;font-style:normal;font-family:var(--display);flex:none;box-shadow:inset 0 0 0 1.5px rgba(201,161,90,.45), 0 4px 12px rgba(31,53,87,.18)}
.brand i{width:34px;height:34px;font-size:17px}
.mark{width:56px;height:56px;font-size:28px}
.app{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:18px max(16px, env(safe-area-inset-right,0px)) 32px max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.mandala{position:fixed;right:-140px;bottom:-140px;width:460px;max-width:none;height:460px;color:var(--mandala);opacity:.18;z-index:0;pointer-events:none}
.mandala.tl{right:auto;bottom:auto;left:-170px;top:-170px;width:380px;height:380px;opacity:.12}

/* ----- type ----- */
h1,h2,h3{margin:0;text-wrap:balance;color:var(--fg)}
h1{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.18;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.25}
h3{font-size:17px;font-weight:700;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px;line-height:1.45}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.dev{font-family:'Noto Sans Devanagari',var(--body)}

/* ----- layout helpers ----- */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* ----- cards ----- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card.row{flex-direction:row}
button.card{text-align:left;font-weight:400;transition:transform .12s ease, box-shadow .12s ease}
button.card:active{transform:scale(.985)}
.card-head{display:flex;align-items:center;gap:12px}
.card-head h3{flex:1}
.ico{width:42px;height:42px;border-radius:50%;background:var(--peach-soft);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.tile{gap:6px;min-height:118px;justify-content:space-between}
.tile .ico{width:36px;height:36px} .tile .ico svg{width:20px;height:20px}
.tile strong{font-size:17px;color:var(--fg);line-height:1.25}
.tile .big{font-family:var(--display);font-size:24px;color:var(--navy)}

/* hero (sankalp countdown) — peach gradient with sunrise-and-temple art */
.hero{position:relative;overflow:hidden;background:var(--hero-grad);color:#F6F2EA;border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:8px;border:none;box-shadow:0 10px 28px rgba(31,53,87,.22)}
.hero>*{position:relative;z-index:1}
.hero h1,.hero h2,.hero h3{color:#FFF9EE}
.hero .art{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hero .muted{color:#E3E9F0}
.hero .eyebrow{color:#F2D58E;text-shadow:0 1px 2px rgba(20,35,60,.3)}
.hero .count{color:#F2D58E;background:linear-gradient(180deg,#F7E2A8,#E2B866);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
.count{font-family:var(--display);font-weight:600;font-size:56px;line-height:1;color:var(--accent);letter-spacing:-.02em}
.hero .bar{background:rgba(255,255,255,.28);height:8px}
.hero .bar b{background:linear-gradient(90deg,#F7E2A8,#E2B866);min-width:8px}

/* welcome hero */
.ganesh-hero{position:relative;overflow:hidden;background:var(--hero-grad);border:none;color:#F6F2EA;border-radius:24px;padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow)}
.ganesh-hero>*{position:relative;z-index:1}
.ganesh-hero>.art{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.ganesh-hero h1{font-size:34px;color:#FFF9EE;text-shadow:0 1px 3px rgba(20,35,60,.35)}
.ganesh-hero .tag{color:#F2D58E;font-weight:600}
.ganesh{width:140px;height:auto;color:#E9C77E;align-self:center}

/* ----- buttons & controls ----- */
button,.btn{font:inherit;cursor:pointer;border-radius:14px;min-height:48px;padding:0 18px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:15.5px;transition:background .15s, border-color .15s, transform .1s}
button:active,.btn:active{transform:scale(.98)}
@media (hover:hover){button:hover,.btn:hover{border-color:#C9D5E2} .btn-primary:hover{background:#1A3355;border-color:#1A3355}}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);box-shadow:0 4px 14px rgba(36,66,107,.22)}
.btn-ghost{background:transparent;border:none;color:var(--gold-ink);min-height:40px;padding:0;font-weight:700;align-self:flex-start;box-shadow:none}
.btn-block{width:100%}
.music{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;border-radius:var(--r-pill);background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:0 14px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.music{background:#EEF3F9;border-color:#D8E2EE;color:var(--navy)}
.music svg{width:16px;height:16px;color:var(--navy)}
.music[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.music[aria-pressed="true"] svg{color:#E9C77E}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb, var(--gold) 70%, transparent);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
label.field span.opt{font-weight:500;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:500;font-size:16px;min-height:48px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;background:var(--surface);color:var(--fg);width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--navy)}
input::placeholder,textarea::placeholder{color:#97A2B1}
textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.check input{width:22px;height:22px;min-height:0;flex:none;margin-top:1px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border-radius:var(--r-pill);padding:0 16px;font-weight:600;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.pill{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:3px 11px;font-size:12.5px;font-weight:700;background:var(--sky);color:var(--sky-ink);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps i{height:6px;border-radius:9px;background:var(--line);display:block}
.steps i.on{background:var(--navy)}
.select-card{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:16px;min-height:0;font-weight:400}
.select-card[aria-pressed="true"]{border:2px solid var(--navy);background:#F5F8FC}
.tick{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--onaccent)}
[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.bar{height:8px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar b{display:block;height:100%;background:var(--navy);border-radius:9px}

/* devotion checklist */
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.todo:last-child{border-bottom:none;padding-bottom:2px}
.todo input{appearance:none;-webkit-appearance:none;width:24px;height:24px;min-height:0;flex:none;margin:0;border:1.8px solid #8396AE;border-radius:7px;background:var(--surface);display:grid;place-items:center;padding:0;cursor:pointer}
.todo input:checked{background:var(--ok);border-color:var(--ok)}
.todo input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:translateY(-1px) rotate(45deg)}
.todo .when{font-size:12.5px;color:var(--muted)}
.done-text{text-decoration:line-through;color:var(--muted)}
.kind{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r-pill);padding:3px 9px;background:var(--sunk);color:var(--muted);margin-top:1px}
.kind{background:var(--sky);color:var(--sky-ink)} .k-Vrat{background:#FBEFDD;color:#8A5E22} .k-Pooja{background:#F3E7D3;color:#7A5A22} .k-Daan{background:var(--okbg);color:var(--ok)} .k-Jap{background:#F5ECDD;color:#7A5A22} .k-Puja,.k-Prayer{background:var(--sky);color:var(--sky-ink)}
.day-head{margin-top:12px;font-size:13px;font-weight:800;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:6px}

/* panchang summary grid with divider */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 0;width:100%}
.pgrid>span{padding:0 14px}
.pgrid>span:nth-child(odd){padding-left:0;border-right:1px solid var(--line)}
.pgrid .k{display:block;font-size:13px;color:var(--muted)} .pgrid strong{font-size:15.5px}

/* ----- tab bar ----- */
.tabs{flex:none;background:var(--surface);border-top:1px solid var(--line);user-select:none;box-shadow:0 -6px 20px rgba(31,53,87,.06);border-radius:22px 22px 0 0;
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));z-index:5}
.tabs[hidden]{display:none}
.tabs .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tabs button{border:none;background:transparent;box-shadow:none;min-height:56px;padding:4px 0 2px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px}
.tabs button{position:relative}
.tabs button span.ti{width:52px;height:30px;border-radius:var(--r-pill);display:grid;place-items:center;transition:background .2s}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--navy);font-weight:800}
.tabs button[aria-current="page"] svg{fill:color-mix(in srgb, var(--navy) 16%, transparent)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34px;height:3px;border-radius:3px;background:var(--gold)}

/* ----- feature pieces ----- */
.mantra{width:min(250px,68vw);aspect-ratio:1;max-width:100%;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#4E7299,#23406A 75%);box-shadow:0 0 0 10px #FFF, 0 0 0 12px var(--gold), var(--shadow-lg);color:#F2D58E;display:flex;flex-direction:column;align-items:center;justify-content:center;align-self:center;margin:12px 0}
.mantra .n{font-family:var(--display);font-size:72px;font-weight:600;line-height:1}
.mantra span:last-child{color:#E3E9F0;font-weight:600}
.video{height:150px;border-radius:var(--r-sm);background:var(--hero-grad);color:#F6F2EA;display:grid;place-items:center;font-size:13.5px;font-weight:600;border:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#FFF8F1;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:9;max-width:90vw;box-shadow:var(--shadow-lg)}
.demo{font-size:13px;background:var(--warnbg);color:var(--warn);border-radius:14px;padding:8px 8px 8px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
.demo button{min-height:34px;font-size:13px;padding:0 12px;box-shadow:none}
.notice{background:var(--sunk);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.screen.enter{animation:in .24s ease-out}@keyframes in{from{opacity:.5;transform:translateY(8px)}to{opacity:1;transform:none}}}

/* jyotish wheel */
.wheel-wrap{max-width:320px;width:100%;align-self:center}
.wheel{width:100%;height:auto;display:block}
.w-ring{fill:none;stroke:var(--line);stroke-width:1.2} .w-line{stroke:var(--line);stroke-width:1}
.w-you{fill:color-mix(in srgb, var(--gold) 22%, transparent);stroke:var(--gold);stroke-width:1.5}
.w-sign{font:700 10px var(--body);fill:var(--muted);text-anchor:middle}
.w-pl{fill:var(--surface);stroke:var(--navy);stroke-width:1.4} .w-pl.Sa,.w-pl.Ra,.w-pl.Ke{stroke:#8C6A2B} .w-pl.Ju,.w-pl.Ve{stroke:var(--ok)}
.w-pt{font:800 9px var(--body);fill:var(--fg);text-anchor:middle}
.w-c{font:600 14px var(--display);fill:var(--navy);text-anchor:middle} .w-c2{font:600 10px var(--body);fill:var(--muted);text-anchor:middle}
.planet{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)} .planet:last-child{border-bottom:none}
.w-dot{width:32px;height:32px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.dosha{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)} .dosha:last-of-type{border-bottom:none}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)} .list-row:last-child{border-bottom:none}
</style>
<style>
/* ===== priest app additions ===== */
.appbar .sub{font-size:11.5px;font-weight:800;color:var(--gold-ink);font-family:var(--body);letter-spacing:.06em;display:block;line-height:1.2}
.appbar .sub span{color:var(--muted);letter-spacing:0;font-weight:700}
.appbar .sub span:not(:empty)::before{content:"· "}
.appbar .brand{line-height:1.1}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:var(--r-pill);padding:4px;gap:4px}
.seg button{border:none;border-radius:var(--r-pill);min-height:42px;background:transparent;box-shadow:none;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--navy);box-shadow:var(--shadow)}
.drow{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;min-height:74px}
.drow-main{display:flex;flex-direction:column;min-width:0;flex:1}
.drow-main strong{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.okdot{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.okdot svg{width:16px;height:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions>.btn-primary{grid-column:1/-1;min-height:58px;font-size:17px}
.actions svg,.btn-gold svg,button svg{width:20px;height:20px;flex:none}
.act,.actions .btn,.actions button,.stack>button{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:15px}
a.btn{color:var(--fg);border-radius:14px;min-height:48px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px}
label.btn{cursor:pointer;border-radius:14px;min-height:48px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px}
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#F7E2A8,#E2B866);color:#2A2414;border:none;font-weight:800;min-height:52px;border-radius:14px;padding:0 20px;box-shadow:0 6px 18px rgba(20,35,60,.25);align-self:flex-start;margin-top:6px}
.btn-gold[disabled]{opacity:.55}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.card .stat{box-shadow:none;background:var(--bg)}
.stat b{font-family:var(--display);font-size:24px;color:var(--navy);line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
.searchbox svg{width:20px;height:20px;color:var(--muted);flex:none}
.searchbox input{border:none;padding-left:0;min-height:50px}
.searchbox input:focus{outline:none}
.searchbox:focus-within{border-color:var(--navy)}
.linkrow{width:100%;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;box-shadow:none;min-height:48px;padding:8px 0;font-weight:600;text-align:left}
.thumb{display:block;width:100%;max-width:260px;border-radius:10px;margin:2px 0 6px}
#readerHost{position:fixed;inset:0;z-index:20}
#readerHost[hidden]{display:none}
.reader{position:absolute;inset:0;background:var(--hero-grad);color:#FFF9EE;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
.rclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.16);border:none;color:#fff;box-shadow:none}
.rclose svg{width:24px;height:24px}
.rcount{font-weight:800;letter-spacing:.08em;color:#F2D58E;margin:6px 0 0}
.rbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:640px;width:100%;margin:0 auto}
.rname{font-family:var(--display);font-size:clamp(34px,9vw,58px);line-height:1.1;font-weight:700;margin:0;color:#FFF9EE}
.rfam{font-size:clamp(20px,5vw,28px);font-weight:600;color:#E3E9F0;margin:0}
.rmeta{font-size:clamp(18px,4.6vw,24px);color:#F2D58E;font-weight:700;margin:0;line-height:1.5}
.rwish{font-size:clamp(18px,4.6vw,24px);margin:0;line-height:1.45}
.rwish span{display:block;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#E3E9F0;margin-bottom:4px}
.rnav{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;max-width:640px;width:100%;margin:0 auto}
.rnav button{min-height:60px;font-size:16px;background:rgba(255,255,255,.16);border:none;color:#fff;box-shadow:none}
.rnav .btn-gold{background:linear-gradient(180deg,#F7E2A8,#E2B866);color:#2A2414;font-size:18px;margin:0;align-self:stretch}
dialog{border:none;border-radius:22px;padding:20px;width:min(92vw,420px);background:var(--surface);color:var(--fg);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(20,35,60,.45)}
code{font-size:13px;background:var(--sunk);padding:1px 6px;border-radius:6px}
#print{display:none}
@media print{
 html,body{overflow:visible;height:auto;background:#fff}
 .shell,.mandala,.toast,#readerHost{display:none!important}
 #print{display:block;font-family:var(--body);color:#000}
 #print h1{font-size:20px;margin:0 0 10px}
 #print table{width:100%;border-collapse:collapse;font-size:13px}
 #print th,#print td{border:1px solid #999;padding:6px;text-align:left;vertical-align:top}
}
