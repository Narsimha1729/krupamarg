/* Layout: one phone-width app column, centred on wide screens; screens swap inside it, bottom tab bar after registration. */
:root{
  --bg:#F6EFE6; --surface:#FFFFFF; --sunk:#EFE4D6; --line:#E3D3C0;
  --fg:#2A1711; --muted:#6E5242; --maroon:#5A1712; --onmaroon:#FFF4E6; --gold:#E9A33A;
  --accent:#A3410A; --onaccent:#FFFFFF; --ok:#2B6A63; --okbg:#E1EFEC; --warn:#8A3A06; --warnbg:#FCEBDD;
  --display:'Rozha One', 'Tiro Devanagari Hindi', Georgia, serif;
  --body:'Mukta', 'Noto Sans Devanagari', system-ui, sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-height:100vh}
:root{--page:#FCF9F4; --mandala:#C9962E}
.mandala{position:fixed;right:-140px;bottom:-140px;width:460px;max-width:none;height:460px;color:var(--mandala);opacity:.16;z-index:0;pointer-events:none}
.mandala.tl{right:auto;bottom:auto;left:-170px;top:-170px;width:380px;height:380px;opacity:.1}
.app{position:relative;z-index:2;max-width:440px;margin:56px auto 110px;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px;
  background:var(--bg);border-radius:26px;border:1px solid var(--line);box-shadow:0 10px 36px rgba(90,23,18,.08)}
.music{position:fixed;z-index:8;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px, calc(env(safe-area-inset-right,0px) + 12px));
  min-height:40px;border-radius:999px;background:var(--surface);color:var(--accent);border:1px solid var(--line);padding:0 14px;font-size:14px;box-shadow:0 4px 14px rgba(90,23,18,.08)}
.music[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.ganesh{width:150px;height:auto;color:var(--gold);align-self:center}
.ganesh-hero{background:var(--maroon);border-radius:20px;padding:18px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--onmaroon);text-align:center}
.proto{font-size:12.5px;color:var(--muted);text-align:center;background:var(--sunk);border-radius:999px;padding:4px 12px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.12}
h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12.5px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hero{background:var(--maroon);color:var(--onmaroon);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hero .muted{color:color-mix(in srgb, var(--onmaroon) 78%, transparent)}
.mark{width:56px;height:56px;border-radius:50%;background:var(--maroon);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:30px;flex:none}
button,.btn{font:inherit;cursor:pointer;border-radius:12px;min-height:48px;padding:0 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-ghost{background:transparent;border:none;color:var(--accent);min-height:36px;padding:0;font-weight:600;align-self:flex-start}
.btn-block{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
label.field span.opt{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:400;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);color:var(--fg);width:100%}
textarea{min-height:76px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:22px;height:22px;min-height:0;flex:none;margin-top:1px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;border-radius:999px;padding:0 14px;font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps i{height:6px;border-radius:9px;background:var(--line);display:block}
.steps i.on{background:var(--accent)}
.select-card{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:14px;min-height:0;font-weight:400}
.select-card[aria-pressed="true"]{border:2.5px solid var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--surface))}
.tick{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--onaccent)}
[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.bar{height:8px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:9px}
.count{font-family:var(--display);font-size:52px;line-height:1;color:var(--gold)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:none}
.todo input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px;accent-color:var(--ok)}
.todo .when{font-size:12.5px;color:var(--muted)}
.done-text{text-decoration:line-through;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);

.tabs button{border:none;background:transparent;min-height:50px;padding:0;font-size:13px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs svg{width:22px;height:22px}
.mantra{width:min(260px,70vw);aspect-ratio:1;max-width:100%;border-radius:50%;border:10px solid var(--gold);background:var(--accent);color:var(--onaccent);display:flex;flex-direction:column;align-items:center;justify-content:center;align-self:center}
.mantra .n{font-size:68px;font-weight:700;line-height:1}
.video{height:150px;border-radius:12px;background:var(--maroon);color:var(--onmaroon);display:grid;place-items:center;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp input{text-align:center;font-size:22px;font-weight:700;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw}
.demo{font-size:13px;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo button{min-height:34px;font-size:13px;padding:0 10px}
.notice{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.screen{animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
.kind{flex:none;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted);margin-top:2px}
.k-Vrat{background:#FCE7D6;color:#8A3605} .k-Pooja{background:#F6E2E0;color:#7A1F1A} .k-Daan{background:var(--okbg);color:var(--ok)} .k-Jap{background:#F3EAD2;color:#6E5212}
.day-head{margin-top:10px;font-size:13px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
.wheel-wrap{max-width:320px;width:100%;align-self:center}
.wheel{width:100%;height:auto;display:block}
.w-ring{fill:none;stroke:var(--line);stroke-width:1.2} .w-line{stroke:var(--line);stroke-width:1}
.w-you{fill:color-mix(in srgb, var(--gold) 22%, transparent);stroke:var(--gold);stroke-width:1.5}
.w-sign{font:600 10.5px var(--body);fill:var(--muted);text-anchor:middle}
.w-pl{fill:var(--surface);stroke:var(--accent);stroke-width:1.4} .w-pl.Sa,.w-pl.Ra,.w-pl.Ke{stroke:var(--maroon)} .w-pl.Ju,.w-pl.Ve{stroke:var(--ok)}

.w-c{font:400 14px var(--display);fill:var(--accent);text-anchor:middle} .w-c2{font:500 10px var(--body);fill:var(--muted);text-anchor:middle}
.planet{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)} .planet:last-child{border-bottom:none}
.w-dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.dosha{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
</style>

let planCache=null;
function plan(){

 const items=[];let week=0;
 for(let i=0;i<=total;i++){const d=addDays(start,i),ds=iso(d),pc=panchang(d),sp=specialDay(pc.t);
  items.push({id:'j'+i,date:ds,kind:'Jap',text:mantras[i%mantras.length]+' × 108'});
  items.push({id:'w'+i,date:ds,kind:'Prayer',text:WISH_DAILY[S.user.wish]});

  if(sp){const t={Ekadashi:'Ekadashi vrat · Vishnu sahasranama',Pradosh:'Pradosh · evening Shiva puja','Sankashti Chaturthi':'Sankashti vrat · Ganesh puja, break the fast at moonrise','Vinayaki Chaturthi':'Vinayaki Chaturthi · modak naivedya to Ganesh',Purnima:'Purnima · Satyanarayan katha',Amavasya:'Amavasya · annadan and a diya for ancestors'}[sp];

 items.sort((a,b)=>a.date.localeCompare(b.date)||order[a.kind]-order[b.kind]);
 planCache={key,items};return items}

function wheel(now,moonR){const c=160,R=150,pos=(L,r)=>{const a=(180+L)*D2R;return[c+r*Math.cos(a),c-r*Math.sin(a)]};

 s+=`<path d="M${x1} ${y1} A${R} ${R} 0 0 0 ${x2} ${y2} L${x3} ${y3} A34 34 0 0 1 ${x4} ${y4} Z" class="w-you"/>`;
 for(let i=0;i<12;i++){const [a,b]=pos(i*30,R),[e,f]=pos(i*30,34);s+=`<line x1="${a}" y1="${b}" x2="${e}" y2="${f}" class="w-line"/>`;const [tx,ty]=pos(i*30+15,R-18);s+=`<text x="${tx}" y="${ty+4}" class="w-sign">${RASHI_S[i]}</text>`}
 const cnt={};Object.keys(PL).forEach(k=>{const r=Math.floor(now[k]/30);cnt[r]=(cnt[r]||0)+1;const n=cnt[r]-1,L=r*30+6+n*6,rad=R-56-n*13,[x,y]=pos(L,rad);

 s+=`<text x="${c}" y="${c-4}" class="w-c">Gochar</text><text x="${c}" y="${c+11}" class="w-c2">${fmt(today)}</text></svg>`;return s}

 if(S.regStep===0){u.name=g('name')||u.name;u.gender=g('gender');u.city=g('city');u.dob=g('dob')||u.dob;u.tob=g('tob');u.pob=g('pob');syncVedic()}
 if(S.regStep===1){u.gotra=g('gotra');u.vedicManual=document.getElementById('vedicManual').checked;if(u.vedicManual){u.rashi=g('rashi');u.nakshatra=g('nakshatra')}else syncVedic()}
 if(S.regStep===3){u.wishText=g('wishText');u.deadline=g('deadline')||u.deadline;u.consent=document.getElementById('consent').checked}}
function go(k){if(k==='demoHome')startDemo();else if(k==='login'||k==='logout'||k==='welcome')S.screen='welcome';else if(k.startsWith('register')){S.screen='register';S.regStep=+k.slice(8)}
 else if(k==='home'){S.screen='app';S.tab='home'}else if(k==='sankalpTab'){S.screen='app';S.tab='sankalp'}else S.screen=k;render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go){e.preventDefault();go(d.go);return}
 if(d.tab){S.screen='app';S.tab=d.tab;render();return}
 if(d.wish){S.user.wishText=document.getElementById('wishText').value;S.user.deadline=document.getElementById('deadline').value;S.user.wish=d.wish;render();return}
 if(d.site){const i=S.sites.indexOf(d.site);i<0?S.sites.push(d.site):S.sites.splice(i,1);render();return}
 if(d.rmfam!==undefined){S.user.family.splice(+d.rmfam,1);render();return}
 if(d.vrat){S.vratWish=d.vrat;render();return}
 if(d.outcome){S.outcome=d.outcome;render();return}
 const a=d.act;if(!a)return;
 if(a==='music'){musicOn=!musicOn;b.setAttribute('aria-pressed',musicOn);b.textContent=musicOn?'♪ Music on':'♪ Temple music';musicOn?startMusic():stopMusic();return}
 if(a==='regBack'){if(S.regStep===0)S.screen=S.paid?'app':'welcome';else{readReg();S.regStep--}render()}
 if(a==='addFam'){const n=document.getElementById('famName').value.trim();if(!n){toast('Type a name first.');return}S.user.family.push({name:n,rel:document.getElementById('famRel').value});render()}
 if(a==='pay'){S.paid=true;S.startedOn=iso(today);S.done={};S.outcome=null;planCache=null;go('paid')}
 if(a==='count'){S.mantra++;S.mantraDay=iso(today);if(!S.mantraDays.includes(iso(today)))S.mantraDays.push(iso(today));if(navigator.vibrate)navigator.vibrate(12);render();if(S.mantra%108===0)toast('One mala complete.')}
 if(a==='resetMantra'){S.mantra=0;render()}
 if(a==='del')$('#delBox').innerHTML='<p class="small">Delete your profile, sankalp and family details? This cannot be undone.</p><div class="grid2"><button data-act="delNo">Keep</button><button class="btn-primary" data-act="delYes">Delete</button></div>';
 if(a==='delNo')render();
 if(a==='delYes'){try{localStorage.removeItem(STORE_KEY)}catch(e){}S=freshState();planCache=null;render();toast('All your data on this device is deleted.')}
 if(a==='demo'){startDemo();render()}
 if(a==='leaveDemo')leaveDemo();
 if(a==='newSankalp'){S.outcome=null;S.done={};S.user.wishText='';S.user.deadline=iso(addDays(today,45));planCache=null;go('register3')}
 if(a==='install'&&deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;render()})}
 if(a==='share'){const d={title:'Icchamarg',text:d0(b),url:location.origin+location.pathname};if(navigator.share)navigator.share(d).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(d.url);toast('Link copied.')}}
 if(a==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='icchamarg-my-data.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
 if(a==='calendar')downloadReminder();});
function d0(b){return b.dataset.share?b.dataset.share+' · on Icchamarg, the path of your wish':(S.outcome==='yes'?'My wish came true. Thank you for your blessings! 🙏':'Icchamarg · register your sankalp and follow a daily devotional plan')}
function downloadReminder(){const [h,m]=(S.remind||'06:30').split(':');const d=iso(today).replace(/-/g,'');const end=S.user.deadline.replace(/-/g,'');
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Icchamarg//EN','BEGIN:VEVENT','UID:icchamarg-'+Date.now()+'@icchamarg','DTSTAMP:'+d+'T000000Z',
  'DTSTART;TZID=Asia/Kolkata:'+d+'T'+h+m+'00','DURATION:PT15M','RRULE:FREQ=DAILY;UNTIL='+end+'T235959Z','SUMMARY:Icchamarg · today\'s puja and jap',
  'DESCRIPTION:Open Icchamarg for today\'s devotion: '+location.origin+location.pathname,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Icchamarg','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
 const u=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));const l=document.createElement('a');l.href=u;l.download='icchamarg-reminder.ics';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Open the file to add the reminder to your calendar.')}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='regForm'){readReg();if(S.regStep===0&&!S.user.name.trim()){toast('Enter your name.');return}
  if(S.regStep===3){if(!S.user.wishText.trim()){toast('Write your sankalp in a few words.');return}if(!S.user.consent){toast('Please tick the box to continue.');return}planCache=null;go(S.paid?'sankalpTab':'sites');return}
  S.regStep++;render()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='lang'){S.lang=t.value;render();return}
 if(t.id==='remind'){S.remind=t.value;saveState();return}
 if(t.dataset.todo){S.done[t.dataset.todo]=t.checked;render()}
 if(t.id==='vedicManual')document.getElementById('vedicFields').hidden=!t.checked;
 if(t.id==='deadline'){const n=document.getElementById('dlNote');if(n)n.textContent=daysBetween(today,t.value)+' days to complete your sankalp. Your puja, vrat and daan schedule is planned before this date.'}});
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(['welcome','paid'].includes(S.screen)||(S.screen==='app'&&S.tab==='profile'))render()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();

/* ---------- temple music (generated live: tanpura drone, temple bell, flute in raag Bhupali) ---------- */
let AC=null,master=null,musicOn=false,musicTimer=null;
function startMusic(){
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){toast('Music is not supported in this browser.');return}
 AC.resume();master=AC.createGain();master.gain.setValueAtTime(0,AC.currentTime);master.gain.linearRampToValueAtTime(0.55,AC.currentTime+2);master.connect(AC.destination);
 const bus=AC.createGain(),delay=AC.createDelay(),fb=AC.createGain();delay.delayTime.value=0.34;fb.gain.value=0.32;bus.connect(master);bus.connect(delay);delay.connect(fb);fb.connect(delay);delay.connect(master);
 const Sa=146.83,tan=[Sa*1.5,Sa*2,Sa*2,Sa],scale=[1,9/8,5/4,3/2,5/3,2,9/4,5/2];let ti=0,ni=3;
 function pluck(f,t){[1,1.004].forEach(m=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f*m;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=3;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.05,t+0.03);g.gain.exponentialRampToValueAtTime(0.0005,t+4);o.connect(lp);lp.connect(g);g.connect(bus);o.start(t);o.stop(t+4.1)})}
 function bell(t){[1,2.76,5.4,8.93].forEach((m,i)=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=Sa*4*m;const g=AC.createGain();g.gain.setValueAtTime(0.09/(i+1),t);g.gain.exponentialRampToValueAtTime(0.0004,t+4.5-i*0.7);o.connect(g);g.connect(bus);o.start(t);o.stop(t+4.6)})}
 function flute(t){ni=Math.max(0,Math.min(scale.length-1,ni+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));const f=Sa*2*scale[ni],d=0.5+Math.random()*1.3;
  const o=AC.createOscillator();o.type='sine';o.frequency.value=f;const lfo=AC.createOscillator();lfo.frequency.value=5.2;const lg=AC.createGain();lg.gain.value=f*0.007;lfo.connect(lg);lg.connect(o.frequency);
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.07,t+0.12);g.gain.setValueAtTime(0.07,t+d-0.15);g.gain.linearRampToValueAtTime(0,t+d);
  o.connect(g);g.connect(bus);o.start(t);lfo.start(t);o.stop(t+d+0.05);lfo.stop(t+d+0.05);return d}
 let next=AC.currentTime+0.1,bnext=AC.currentTime+0.6,fnext=AC.currentTime+3;
 function sched(){const h=AC.currentTime+1;while(next<h){pluck(tan[ti%4],next);ti++;next+=1.15}while(bnext<h){bell(bnext);bnext+=10+Math.random()*8}while(fnext<h){const d=flute(fnext);fnext+=d+(Math.random()<0.25?1.4:0.06)}}
 sched();clearInterval(musicTimer);musicTimer=setInterval(sched,250)}
function stopMusic(){clearInterval(musicTimer);if(master&&AC){const m=master;m.gain.cancelScheduledValues(AC.currentTime);m.gain.setValueAtTime(m.gain.value,AC.currentTime);m.gain.linearRampToValueAtTime(0,AC.currentTime+0.8);setTimeout(()=>m.disconnect(),900)}}

</script>
